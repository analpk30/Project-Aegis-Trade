services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: guardian-app
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PYTHON_PORT: 5000
      CACHE_TTL_SECONDS: 60
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
